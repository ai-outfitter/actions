name: Run Outfitter Profile
description: >-
  Run an Outfitter profile headless in GitHub Actions to build scheduled
  commit reviewers, PR reviewers, or task agents.
author: ai-outfitter
branding:
  icon: compass
  color: orange

inputs:
  prompt:
    description: >-
      The prompt passed to the agent in print mode. The agent runs headless,
      does its work, prints its result, and exits.
    required: true
  agent:
    description: >-
      Agent slug to run, resolved from the catalog. This is the fallback, not
      an override: an `agent:<slug>` label on the triggering issue or pull
      request selects the agent first, then this input, then the catalog's own
      `default_agent`. A workflow that overrode the label could never be routed
      by one, which is the point of labelling.
    required: false
    default: ""
  source:
    description: >-
      Catalog to resolve the agent from. Accepts an `owner/repo` GitHub
      shorthand, any git-cloneable URI, or a path inside the checked-out
      repository. Optional: when omitted the action defaults to the
      repository's own `.agents/`, then a Dotagents payload at the repository
      root, then `<owner>/.agents` — so a repository that keeps its catalog in
      the usual place passes no source at all.
    required: false
    default: ""
  source-ref:
    description: >-
      Optional tag, branch, or commit to pin a remote source to. Strongly
      recommended for catalogs you do not own — an unpinned source runs
      whatever the catalog publishes next. Ignored for a path source.
    required: false
    default: ""
  harness:
    description: "Harness to launch the agent in: pi, claude, or codex."
    required: false
    default: pi
  browser:
    description: >-
      Browser to provide for the run: `none` or `chrome`. With `chrome`, the
      action makes sure a Chromium binary exists on the runner and exports its
      path as CHROME_PATH and PUPPETEER_EXECUTABLE_PATH, so a browser MCP
      server declared by the profile (for example `chrome-devtools-mcp` or the
      Playwright MCP) can start it. A browser already installed on the runner
      is used as-is; otherwise the action installs Chromium with
      `npx playwright install --with-deps chromium`. GitHub-hosted Ubuntu
      runners ship Chrome; most self-hosted and Forgejo runner images do not.
    required: false
    default: none
  inference:
    description: >-
      Inference route for the run: `outfitter` or `none`. With `outfitter`,
      the agent's `outfitter` provider is routed through the Outfitter
      inference gateway using the job's GitHub Actions OIDC identity, so no
      provider secret is needed. Requires `permissions: id-token: write` on
      the job and a catalog `models.json` provider `outfitter` with
      `baseUrl: http://127.0.0.1:4141/v1` and
      `apiKey: "$OUTFITTER_INFERENCE_TOKEN"`. Without an `inference-gateway`,
      provider credentials in the step's `env:` (`OPENAI_API_KEY`,
      `ANTHROPIC_API_KEY`, `OPENROUTER_API_KEY`, `SPARK_API_KEY`,
      `SPARK_AUTHORIZATION`, `SPARK_ACCESS_CLIENT_ID` or any `*_API_KEY`) are
      used as before and the relay is skipped; with none, the run goes through
      Outfitter's hosted gateway. Set `none` to skip the relay unconditionally.
    required: false
    default: outfitter
  inference-gateway:
    description: >-
      URL of the Outfitter deployment's inference gateway, for example
      `https://inference.example.com`. Empty, the default, means Outfitter's
      hosted gateway, `https://inference.ai-outfitter.com`, unless the step's
      `env:` carries provider credentials, which the job then uses itself.
    required: false
    default: ""
  github-token:
    description: >-
      Token exported as GH_TOKEN / GITHUB_TOKEN for the agent's `gh` and `git`
      calls. Defaults to the workflow's installation token; pass a fine-grained
      PAT from a dedicated machine account to have the agent comment, push, or
      open PRs under that account. See docs/token-permissions.md and
      docs/bot-account.md before widening this.
    required: false
    default: ${{ github.token }}
  git-user-name:
    description: Git author/committer name for any commits the agent makes.
    required: false
    default: ""
  git-user-email:
    description: Git author/committer email for any commits the agent makes.
    required: false
    default: ""
  outfitter-version:
    description: "@ai-outfitter/outfitter version to install."
    required: false
    default: latest
  strict:
    description: >-
      Fail the run and its resolution preflights on warnings, including
      ambiguous source resolution and untranslatable profile controls. This
      is the default because CI warnings go unread. Strict preflights need
      `@ai-outfitter/outfitter` >= 1.7.0; older pinned versions skip them
      (`run --strict` still applies). Set `strict: false` only as a temporary
      escape hatch for catalog/CLI capability skew or a deliberate short-lived
      divergence, and include an expiry comment.
    required: false
    default: "true"
  working-directory:
    description: Directory the agent runs in.
    required: false
    default: "."
  transcript-artifact:
    description: >-
      Name of the workflow artifact to save the agent's full session
      transcript to, as a self-contained HTML page (pi's native session
      export). Set to an empty string to disable. Currently pi-only; ignored
      for other agents. The artifact link is exposed as the
      `transcript-artifact-url` output so workflows can post it back to the
      issue or PR the agent worked on.
    required: false
    default: outfitter-transcript

outputs:
  transcript-artifact-url:
    description: >-
      URL of the uploaded transcript artifact, or empty when transcript
      saving is disabled, unsupported for the agent, or no session was
      written. Viewing requires being logged in to GitHub with access to
      the repository.
    value: ${{ steps.transcript-upload.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - name: Install Outfitter
      shell: bash
      run: npm install -g "@ai-outfitter/outfitter@${{ inputs.outfitter-version }}"

    - name: Resolve catalog source and agent
      id: resolve
      shell: bash
      env:
        AGENT_INPUT: ${{ inputs.agent }}
        SOURCE_INPUT: ${{ inputs.source }}
        SOURCE_REF: ${{ inputs.source-ref }}
        HARNESS: ${{ inputs.harness }}
        OUTFITTER_STRICT: ${{ inputs.strict }}
      run: |
        set -euo pipefail

        strict_flag=""
        [ "$OUTFITTER_STRICT" = "true" ] && strict_flag="--strict"
        preflight_strict=""
        # Preflight --strict exists from outfitter 1.7.0; older pinned CLIs skip it rather than die on an unknown flag.
        if [ -n "$strict_flag" ] && outfitter sync --help 2>/dev/null | grep -q -- '--strict'; then
          preflight_strict="$strict_flag"
        fi

        # ── source ────────────────────────────────────────────────────────
        # Default to where a catalog conventionally lives, so a repository
        # that keeps one in the usual place passes no source at all:
        #   1. an explicit input
        #   2. the repository's own .agents/
        #   3. a Dotagents payload at the repository root (catalog repos)
        #   4. <owner>/.agents — the organization catalog
        # The org catalog is a pointer as much as a container: its own
        # settings.yml names the sources that carry most agents, and
        # `outfitter sync` follows them.
        source="$SOURCE_INPUT"
        origin="input"
        if [ -z "$source" ]; then
          if [ -d "$GITHUB_WORKSPACE/.agents" ]; then
            source="$GITHUB_WORKSPACE/.agents"; origin="repository .agents/"
          elif [ -d "$GITHUB_WORKSPACE/agents" ] || [ -f "$GITHUB_WORKSPACE/settings.yml" ]; then
            source="$GITHUB_WORKSPACE"; origin="payload at repository root"
          else
            source="$GITHUB_REPOSITORY_OWNER/.agents"; origin="organization catalog"
          fi
        fi

        # Classify: a directory in the checkout -> path, a git URI -> uri,
        # an owner/repo shorthand -> github.
        if [ -e "$source" ] || [ -e "$GITHUB_WORKSPACE/$source" ]; then
          source_kind="path"
          [ -e "$source" ] || source="$GITHUB_WORKSPACE/$source"
        else
          case "$source" in
            *://*|git+*) source_kind="uri" ;;
            */*)         source_kind="github" ;;
            *)
              echo "source '$source' is neither an existing path, a git URI, nor an owner/repo shorthand" >&2
              exit 1
              ;;
          esac
        fi
        echo "Catalog source: $source ($source_kind, from $origin)"

        # ── agent ─────────────────────────────────────────────────────────
        # An `agent:<slug>` label on the triggering issue or pull request
        # selects the agent — the convention the catalog's own agents document
        # for themselves. The input is the fallback for when no label routes,
        # not an override: a workflow that hardcoded the agent could never be
        # routed by label, which is the whole point of labelling one.
        #
        # Only accounts with triage permission or above can label, so this is
        # not an avenue for an issue author to choose the agent. Labels are
        # read from the event payload with jq and never interpolated into this
        # script; the only thing done with the value is a slug-shape check.
        agent=""
        if [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
          agent="$(jq -r '
            [ (.issue.labels // .pull_request.labels // [])[]
              | (.name // empty)
              | select(startswith("agent:"))
              | ltrimstr("agent:") ] | first // empty
          ' "$GITHUB_EVENT_PATH")"
          if [ -n "$agent" ]; then
            case "$agent" in
              *[!a-zA-Z0-9._-]*|"")
                echo "ignoring agent label '$agent': not a valid agent slug" >&2
                agent=""
                ;;
              *) echo "Agent from label: $agent" ;;
            esac
          fi
        fi
        if [ -z "$agent" ] && [ -n "$AGENT_INPUT" ]; then
          agent="$AGENT_INPUT"
          echo "Agent from input: $agent"
        fi
        # Empty is allowed: the catalog's own default_agent then applies, and
        # `outfitter run` reports an actionable error when it has none.

        {
          echo "default_harness: $HARNESS"
          [ -n "$agent" ] && echo "default_agent: $agent"
          echo "sources:"
          if [ "$source_kind" != "path" ] && [ -n "$SOURCE_REF" ]; then
            echo "  - $source_kind: $source"
            echo "    ref: $SOURCE_REF"
          else
            echo "  - $source_kind: $source"
          fi
        } > "$RUNNER_TEMP/outfitter-settings.yml"
        mkdir -p "$HOME/.agents"
        # Remove first rather than overwrite: a self-hosted or Forgejo runner
        # reuses HOME between jobs, so a leftover file — or a symlink pointing
        # somewhere else — would otherwise decide where this write lands and
        # silently change which catalog the run resolves against.
        rm -f "$HOME/.agents/settings.yml"
        cp "$RUNNER_TEMP/outfitter-settings.yml" "$HOME/.agents/settings.yml"
        echo "--- settings.yml ---"; cat "$HOME/.agents/settings.yml"

        echo "agent=$agent" >> "$GITHUB_OUTPUT"

        if [ "$source_kind" = "uri" ] || [ "$source_kind" = "github" ]; then
          outfitter sync $preflight_strict
        fi
        # Fail here rather than inside the harness: an agent that cannot be
        # resolved is a configuration error, and the list is the fix.
        outfitter list agents $preflight_strict

    - name: Provide browser
      if: inputs.browser != '' && inputs.browser != 'none'
      shell: bash
      env:
        BROWSER_INPUT: ${{ inputs.browser }}
      run: |
        if [ "$BROWSER_INPUT" != "chrome" ]; then
          echo "browser: unsupported value '$BROWSER_INPUT' (expected 'none' or 'chrome')" >&2
          exit 1
        fi
        if [ "$RUNNER_OS" != "Linux" ]; then
          echo "browser: chrome provisioning supports Linux runners only (got $RUNNER_OS)" >&2
          exit 1
        fi
        # Prefer a browser the runner already has — GitHub-hosted Ubuntu
        # images ship Chrome, and downloading Chromium there wastes ~1 min.
        chrome_bin=""
        for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
          if command -v "$candidate" >/dev/null 2>&1; then
            chrome_bin="$(command -v "$candidate")"
            break
          fi
        done
        if [ -z "$chrome_bin" ]; then
          # --with-deps installs the shared libraries Chromium needs; it uses
          # sudo only when not already root, which covers rootful container
          # runners (the common Forgejo case) and sudo-capable VMs.
          npx --yes playwright install --with-deps chromium
          # PLAYWRIGHT_BROWSERS_PATH may hold the sentinel `0` (install into
          # node_modules) or another non-directory value; only trust it when
          # it is a real directory.
          browsers_root="$HOME/.cache/ms-playwright"
          if [ -n "${PLAYWRIGHT_BROWSERS_PATH:-}" ] && [ -d "$PLAYWRIGHT_BROWSERS_PATH" ]; then
            browsers_root="$PLAYWRIGHT_BROWSERS_PATH"
          fi
          chrome_bin="$(find "$browsers_root" \
            -type f -name chrome -path '*chrome-linux*' 2>/dev/null | head -n1)"
        fi
        if [ -z "$chrome_bin" ]; then
          echo "browser: chrome was requested but no Chromium binary was found after install" >&2
          exit 1
        fi
        echo "Using browser at $chrome_bin"
        {
          echo "CHROME_PATH=$chrome_bin"
          echo "PUPPETEER_EXECUTABLE_PATH=$chrome_bin"
        } >> "$GITHUB_ENV"

    - name: Configure git identity
      if: inputs.git-user-name != '' || inputs.git-user-email != ''
      shell: bash
      env:
        GIT_NAME: ${{ inputs.git-user-name }}
        GIT_EMAIL: ${{ inputs.git-user-email }}
      run: |
        if [ -n "$GIT_NAME" ]; then
          git config --global user.name "$GIT_NAME"
        fi
        if [ -n "$GIT_EMAIL" ]; then
          git config --global user.email "$GIT_EMAIL"
        fi

    # The relay holds the job's OIDC ID token and presents it to the gateway;
    # the agent only ever sees the placeholder key `relay` on loopback.
    - name: Start inference relay
      if: inputs.inference != 'none'
      shell: bash
      env:
        INFERENCE_INPUT: ${{ inputs.inference }}
        INFERENCE_GATEWAY: ${{ inputs.inference-gateway }}
        HOSTED_GATEWAY: https://inference.ai-outfitter.com
      run: |
        if [ "$INFERENCE_INPUT" != "outfitter" ]; then
          echo "::error::inference: unsupported value '$INFERENCE_INPUT' (expected 'outfitter' or 'none')"
          exit 1
        fi
        # No gateway named: provider credentials in the step's env (set, even
        # to an empty secret) mean the workflow brings its own provider, as
        # every workflow did before this input existed. Without any, the run
        # goes through Outfitter's hosted gateway.
        if [ -z "$INFERENCE_GATEWAY" ]; then
          credentials="$(compgen -e | grep -E '^(OPENAI_API_KEY|ANTHROPIC_API_KEY|OPENROUTER_API_KEY|SPARK_API_KEY|SPARK_AUTHORIZATION|SPARK_ACCESS_CLIENT_ID|SPARK_ACCESS_CLIENT_SECRET|[A-Z0-9_]+_API_KEY)$' | paste -sd ' ' || true)"
          if [ -n "$credentials" ]; then
            echo "::notice::inference: no 'inference-gateway' set; the agent uses the provider credentials in its environment ($credentials)."
            exit 0
          fi
          INFERENCE_GATEWAY="$HOSTED_GATEWAY"
          echo "::notice::inference: no 'inference-gateway' and no provider credentials in env; inference goes through Outfitter's hosted gateway $HOSTED_GATEWAY."
        fi
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "::error::inference: 'outfitter' authenticates with the job's OIDC identity, but this job cannot request an ID token. Add 'permissions: id-token: write' to the workflow or job, pass provider credentials through the step's 'env:', or set 'inference: none'."
          exit 1
        fi
        port=4141
        log="$RUNNER_TEMP/inference-relay.log"
        # The relay records a gateway refusal of the job's identity here, so
        # the final step can say that no Outfitter account is connected.
        refused="$RUNNER_TEMP/inference-refused.json"
        rm -f "$refused"
        # Redirect output: a background process that keeps the step's stdout
        # open would hold the step until it exits.
        INFERENCE_GATEWAY_URL="$INFERENCE_GATEWAY" \
        INFERENCE_REFUSAL_FILE="$refused" \
        ACTIONS_ID_TOKEN_REQUEST_URL="$ACTIONS_ID_TOKEN_REQUEST_URL" \
        ACTIONS_ID_TOKEN_REQUEST_TOKEN="$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
        PORT="$port" \
          nohup node "$GITHUB_ACTION_PATH/scripts/inference-relay.mjs" > "$log" 2>&1 &
        pid=$!
        # node rather than curl: self-hosted and Forgejo runner images may
        # lack curl, and node is present since Outfitter was just installed.
        ready=false
        for _ in $(seq 1 20); do
          if ! kill -0 "$pid" 2>/dev/null; then
            break
          fi
          if node -e "fetch('http://127.0.0.1:$port/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"; then
            ready=true
            break
          fi
          sleep 0.5
        done
        if [ "$ready" != "true" ]; then
          echo "::error::inference: the relay did not become healthy on 127.0.0.1:$port within 10 s"
          cat "$log" >&2
          kill "$pid" 2>/dev/null || true
          exit 1
        fi
        cat "$log"
        {
          echo "OUTFITTER_INFERENCE_TOKEN=relay"
          echo "OUTFITTER_INFERENCE_BASE_URL=http://127.0.0.1:$port/v1"
          echo "OUTFITTER_INFERENCE_GATEWAY=$INFERENCE_GATEWAY"
          echo "INFERENCE_RELAY_PID=$pid"
        } >> "$GITHUB_ENV"

    - name: Run agent
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OUTFITTER_AGENT: ${{ steps.resolve.outputs.agent }}
        OUTFITTER_HARNESS: ${{ inputs.harness }}
        OUTFITTER_PROMPT: ${{ inputs.prompt }}
        OUTFITTER_STRICT: ${{ inputs.strict }}
        TRANSCRIPT_ARTIFACT: ${{ inputs.transcript-artifact }}
      run: |
        strict_flag=""
        [ "$OUTFITTER_STRICT" = "true" ] && strict_flag="--strict"
        set -- -p "$OUTFITTER_PROMPT"
        # Pin the session to a known directory so the transcript steps can
        # find and export it. pi-only: the others take no --session-dir.
        if [ "$OUTFITTER_HARNESS" = "pi" ] && [ -n "$TRANSCRIPT_ARTIFACT" ]; then
          mkdir -p "$RUNNER_TEMP/outfitter-sessions"
          set -- "$@" --session-dir "$RUNNER_TEMP/outfitter-sessions"
        fi
        # The agent slug is positional and the harness is --harness. The old
        # `--profile`/`--agent` flags were removed when the CLI renamed
        # profiles to agents (OFTR-002), and passing them made every run die
        # with "Unknown agent '--profile'" before the harness ever started.
        # An empty slug is intentional: the catalog's default_agent applies.
        # The relay already holds the job's OIDC identity. Nothing the agent
        # runs may mint its own ID tokens, for this audience or any other the
        # organization trusts, so the request variables are withheld from it.
        env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
        outfitter run ${OUTFITTER_AGENT:+"$OUTFITTER_AGENT"} \
          --harness "$OUTFITTER_HARNESS" $strict_flag -- "$@"

    # Export the session to self-contained HTML even when the agent step
    # failed — a transcript is most valuable for diagnosing a failed run.
    - name: Export session transcript
      id: transcript-export
      if: ${{ always() && inputs.harness == 'pi' && inputs.transcript-artifact != '' }}
      shell: bash
      run: |
        # Portable newest-file selection (xargs -r is GNU-only and fails on
        # macOS runners). Session paths contain no whitespace.
        newest=""
        for f in $(find "$RUNNER_TEMP/outfitter-sessions" -name '*.jsonl' -type f 2>/dev/null); do
          if [ -z "$newest" ] || [ "$f" -nt "$newest" ]; then
            newest="$f"
          fi
        done
        if [ -z "$newest" ]; then
          echo "No session file found under \$RUNNER_TEMP/outfitter-sessions; skipping transcript export." >&2
          echo "found=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # pi ships as a dependency of the globally installed outfitter; npm
        # does not link dependency bins onto PATH.
        pi_bin="$(npm root -g)/@ai-outfitter/outfitter/node_modules/.bin/pi"
        [ -x "$pi_bin" ] || pi_bin="$(command -v pi || true)"
        if [ -z "$pi_bin" ]; then
          echo "pi binary not found; skipping transcript export." >&2
          echo "found=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        mkdir -p "$RUNNER_TEMP/outfitter-transcript"
        (cd "$RUNNER_TEMP/outfitter-transcript" && "$pi_bin" --export "$newest")
        echo "found=true" >> "$GITHUB_OUTPUT"

    - name: Upload session transcript
      id: transcript-upload
      if: ${{ always() && steps.transcript-export.outputs.found == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.transcript-artifact }}
        path: ${{ runner.temp }}/outfitter-transcript/
        if-no-files-found: ignore

    # Also the place a gateway refusal of the job's identity is reported: the
    # agent saw only 403s, so the run says on the issue or pull request that
    # no Outfitter account is connected, and fails with the same message.
    - name: Stop inference relay
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        HOSTED_GATEWAY: https://inference.ai-outfitter.com
      run: |
        if [ -n "${INFERENCE_RELAY_PID:-}" ]; then
          kill "$INFERENCE_RELAY_PID" 2>/dev/null || true
        fi
        refused="$RUNNER_TEMP/inference-refused.json"
        [ -f "$refused" ] || exit 0
        gateway="${OUTFITTER_INFERENCE_GATEWAY:-$HOSTED_GATEWAY}"
        owner="$GITHUB_REPOSITORY_OWNER"
        if [ "$gateway" = "$HOSTED_GATEWAY" ]; then
          connect="Sign in at https://ai-outfitter.com and connect the GitHub account \`$owner\` to an Outfitter organization"
        else
          connect="Connect the GitHub account \`$owner\` to an organization on the Outfitter deployment behind $gateway"
        fi
        message="No Outfitter account is connected for $owner: the inference gateway $gateway refused this job's identity. $connect, or pass provider credentials to ai-outfitter/actions through the step's 'env:'."
        # The issue or pull request the run is about: the event's, or the
        # ISSUE_NUMBER / PR_NUMBER a dispatched workflow sets in its env.
        number=""
        if [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
          number="$(jq -r '.pull_request.number // .issue.number // empty' "$GITHUB_EVENT_PATH")"
        fi
        [ -n "$number" ] || number="${PR_NUMBER:-${ISSUE_NUMBER:-}}"
        marker="<!-- outfitter-inference-unconnected -->"
        case "$number" in
          ''|*[!0-9]*) echo "::warning::inference: no issue or pull request to comment on." ;;
          *)
            if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$number/comments" --jq '.[].body' 2>/dev/null | grep -qF "$marker"; then
              echo "The run's issue or pull request already carries the comment."
            else
              body="$marker
        **No Outfitter account is connected for \`$owner\`.**

        This run routed its inference through the Outfitter gateway \`$gateway\`, which refused the job's GitHub identity: no Outfitter organization is connected to \`$owner\`. $connect, or pass provider credentials to \`ai-outfitter/actions\` through the step's \`env:\`.

        Reported by [ai-outfitter/actions](https://github.com/ai-outfitter/actions) from workflow run [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
              gh api "repos/$GITHUB_REPOSITORY/issues/$number/comments" -f body="$body" > /dev/null \
                || echo "::warning::inference: could not comment on #$number (does the token have issues: write or pull-requests: write?)."
            fi
            ;;
        esac
        echo "::error::inference: $message"
        exit 1
