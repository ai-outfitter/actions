name: New capability or change
description: >-
  Request a new input, trigger pattern, example, or a change to an existing
  one. The triage agent will label it and comment with a suggested plan.
title: "feat: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: What does this touch?
      options:
        - Action inputs or outputs
        - A new example workflow
        - Profile resolution from the catalog source
        - Harness support
        - Transcript capture and evidence
        - Credentials and token permissions
        - The outfitter-actions skill
        - Documentation
        - Something else
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What can you not do today?
      description: >-
        The workflow you are trying to build, not the solution you have in
        mind. A request stated as a problem survives a better idea than yours.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should it do?
      description: Include the workflow shape you want, if you have one in mind.
      render: yaml
    validations:
      required: true
  - type: input
    id: trigger
    attributes:
      label: Trigger involved
      description: The workflow event this is about, if it is specific to one.
      placeholder: e.g. issue_comment, workflow_dispatch
    validations:
      required: false
  - type: textarea
    id: workaround
    attributes:
      label: What are you doing instead?
      description: >-
        The workaround, if you have one. It shows how urgent this is and often
        shows the shape the real fix should take.
    validations:
      required: false
